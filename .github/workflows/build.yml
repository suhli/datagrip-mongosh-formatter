name: Build
on:
  push:
    branches: [main]
  pull_request:

jobs:
  native-sidecar:
    name: Sidecar (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: linux-x64
            run_tests: true
          - runner: ubuntu-latest
            target: linux-aarch64
            # Prebuilt aarch64 qjs binary + formatter.js (interpreter). Cannot execute on x64.
            run_tests: false
          - runner: windows-latest
            target: windows-x64
            run_tests: true
          - runner: macos-15-intel
            target: macos-x64
            run_tests: true
          - runner: macos-14
            target: macos-aarch64
            run_tests: true
    steps:
      - name: Fetch Sources
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sidecar/package-lock.json

      - name: Install and build sidecar bundle
        working-directory: sidecar
        run: |
          npm ci
          npm run build

      - name: Package native sidecar
        working-directory: sidecar
        env:
          SIDECAR_TARGETS: ${{ matrix.target }}
          SIDECAR_OUTPUT_DIR: ${{ github.workspace }}/artifacts/sidecar
        run: npm run package-native

      - name: Verify manifest and required file hashes
        working-directory: sidecar
        shell: bash
        run: |
          node -e "
          const fs = require('fs');
          const crypto = require('crypto');
          const path = require('path');
          const dir = path.join(process.env.GITHUB_WORKSPACE, 'artifacts', 'sidecar', process.env.TARGET);
          const manifest = JSON.parse(fs.readFileSync(path.join(dir, 'manifest.json'), 'utf8'));
          if (!manifest.contentHash || !manifest.mode || !Array.isArray(manifest.requiredFiles)) {
            throw new Error('invalid manifest');
          }
          for (const file of manifest.requiredFiles) {
            const bytes = fs.readFileSync(path.join(dir, file.name));
            const actual = crypto.createHash('sha256').update(bytes).digest('hex');
            if (actual !== file.sha256) throw new Error('hash mismatch for ' + file.name);
          }
          console.log('manifest ok', process.env.TARGET, manifest.mode, manifest.contentHash.slice(0, 12));
          "
        env:
          TARGET: ${{ matrix.target }}

      - name: Run sidecar tests
        if: matrix.run_tests
        working-directory: sidecar
        env:
          SIDECAR_DIR: ${{ github.workspace }}/artifacts/sidecar/${{ matrix.target }}
        run: npm test

      - name: Upload sidecar artifact
        uses: actions/upload-artifact@v4
        with:
          name: sidecar-${{ matrix.target }}
          path: artifacts/sidecar/${{ matrix.target }}/**
          if-no-files-found: error

  assemble:
    name: Assemble, Test, Verify
    needs: native-sidecar
    runs-on: ubuntu-latest
    env:
      SIDECAR_SKIP_PACKAGE: "1"
      SIDECAR_TARGETS: linux-x64,windows-x64,macos-x64,macos-aarch64,linux-aarch64
    steps:
      - name: Fetch Sources
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sidecar/package-lock.json

      - name: Gradle Wrapper Validation
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Download sidecar artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: sidecar-*
          path: build/generated/sidecar-resources/sidecar
          merge-multiple: false

      - name: Flatten sidecar artifacts
        shell: bash
        run: |
          set -euo pipefail
          ROOT="build/generated/sidecar-resources/sidecar"
          for dir in "$ROOT"/sidecar-*; do
            target="${dir##*/sidecar-}"
            mkdir -p "$ROOT/$target"
            # download-artifact may nest as sidecar-<target>/<files> or sidecar-<target>/<target>/<files>
            if [[ -f "$dir/manifest.json" ]]; then
              cp -a "$dir"/. "$ROOT/$target"/
            elif [[ -f "$dir/$target/manifest.json" ]]; then
              cp -a "$dir/$target"/. "$ROOT/$target"/
            else
              echo "Cannot locate manifest under $dir"
              find "$dir" -maxdepth 3 -type f | head
              exit 1
            fi
            rm -rf "$dir"
            test -f "$ROOT/$target/manifest.json"
            # GitHub artifact upload/download normalizes file permissions.
            if [[ "$target" != windows-* ]]; then
              chmod +x "$ROOT/$target/mongosh-formatter"
            fi
            echo "staged $target"
          done

      - name: Install sidecar npm deps for unit tests
        working-directory: sidecar
        run: npm ci

      - name: Sidecar unit + integration tests, Kotlin tests, Plugin Verifier
        run: ./gradlew sidecarTest test verifyPlugin --console=plain

      - name: Build plugin
        run: ./gradlew buildPlugin --console=plain

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-distribution
          path: build/distributions/*
