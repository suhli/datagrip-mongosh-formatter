name: Build
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.properties.outputs.version }}
    steps:
      - name: Fetch Sources
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sidecar/package-lock.json

      - name: Gradle Wrapper Validation
        uses: gradle/actions/wrapper-validation@v4

      - name: Export Properties
        id: properties
        shell: bash
        run: |
          VERSION="$(./gradlew properties --console=plain -q | sed -n 's/^version: //p')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Test and verify plugin
        env:
          SIDECAR_TARGETS: linux-x64,windows-x64,macos-x64,macos-aarch64,linux-aarch64
        run: ./gradlew sidecarTest test verifyPlugin --console=plain

      - name: Build plugin
        env:
          SIDECAR_TARGETS: linux-x64,windows-x64,macos-x64,macos-aarch64,linux-aarch64
        run: ./gradlew buildPlugin --console=plain

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-distribution
          path: build/distributions/*

  releaseDraft:
    name: Release Draft
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Fetch Sources
        uses: actions/checkout@v4

      - name: Remove Old Release Drafts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/{owner}/{repo}/releases \
            --jq '.[] | select(.draft == true) | .id' \
            | xargs -r -I '{}' gh api -X DELETE repos/{owner}/{repo}/releases/{}

      - name: Create Release Draft
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ needs.build.outputs.version }}" \
            --draft \
            --title "v${{ needs.build.outputs.version }}" \
            --notes "QuickJS sidecar MongoJS formatter ${{ needs.build.outputs.version }}"
