name: Build
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Sources
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sidecar/package-lock.json

      - name: Gradle Wrapper Validation
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test and verify plugin
        env:
          SIDECAR_TARGETS: linux-x64,windows-x64,macos-x64,macos-aarch64,linux-aarch64
        run: ./gradlew sidecarTest test verifyPlugin --console=plain

      - name: Build plugin
        env:
          SIDECAR_TARGETS: linux-x64,windows-x64,macos-x64,macos-aarch64,linux-aarch64
        run: ./gradlew buildPlugin --console=plain

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-distribution
          path: build/distributions/*
